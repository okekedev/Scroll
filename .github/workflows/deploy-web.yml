name: Deploy scroll.okeke.us

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC federated auth
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Test and deploy to Azure Static Web Apps
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: node --test tests/web/*.test.mjs

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch SWA deployment token
        id: token
        run: |
          T=$(az staticwebapp secrets list -n swa-scroll -g rg-websites --query "properties.apiKey" -o tsv)
          echo "::add-mask::$T"
          echo "value=$T" >> "$GITHUB_OUTPUT"

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.value }}
          action: upload
          app_location: 'web'
          output_location: ''
          skip_app_build: true

      # Tell Bing and the other IndexNow engines that the pages changed, instead of
      # waiting for a crawl. The key is public by design: it is served at /<key>.txt
      # to prove the ping comes from this site (see scripts/build-pages.mjs).
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          sleep 30
          python3 - <<'PY'
          import glob, json, os, re, urllib.request
          host = "scroll.okeke.us"
          key = next(name[:-4] for name in map(os.path.basename, glob.glob("web/*.txt"))
                     if re.fullmatch(r"[0-9a-f]{32}\.txt", name))
          urls = re.findall(r"<loc>([^<]+)</loc>", open("web/sitemap.xml").read())
          body = json.dumps({"host": host, "key": key,
                             "keyLocation": f"https://{host}/{key}.txt", "urlList": urls}).encode()
          request = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                           headers={"Content-Type": "application/json; charset=utf-8"})
          with urllib.request.urlopen(request, timeout=30) as response:
              print("IndexNow:", response.status, len(urls), "URLs")
          PY
