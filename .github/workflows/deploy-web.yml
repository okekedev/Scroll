name: Deploy scroll.okeke.us

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC federated auth
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Test and deploy to Azure Static Web Apps
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: node --test tests/web/format.test.mjs

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch SWA deployment token
        id: token
        run: |
          T=$(az staticwebapp secrets list -n swa-scroll -g rg-websites --query "properties.apiKey" -o tsv)
          echo "::add-mask::$T"
          echo "value=$T" >> "$GITHUB_OUTPUT"

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.value }}
          action: upload
          app_location: 'web'
          output_location: ''
          skip_app_build: true
